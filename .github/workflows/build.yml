name: build installers

# Builds the Windows installer and the macOS .dmg with a bundled Python
# (packaging/build.py). Artifacts are attached to every run; pushing a tag
# like v0.1.0 also publishes them as a GitHub release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build .app and .dmg
        env:
          # Set these repository secrets to sign with a Developer ID; otherwise ad-hoc.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: python packaging/build.py --target macos-arm64
      - name: Self-test the bundle
        run: |
          MNT=$(hdiutil attach -nobrowse -readonly dist/*.dmg | tail -1 | cut -f3)
          "$MNT/Requirements Workbench.app/Contents/MacOS/Requirements Workbench" --self-test
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: python packaging/build.py --target windows-x64
      - name: Self-test the bundled runtime
        run: build\windows\stage\python\python.exe build\windows\stage\app\boot.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

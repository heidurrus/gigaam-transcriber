<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setting up — Requirements Workbench</title>
<style>
  /* Same tokens as index.html (palette from docs/prototype) */
  :root {
    --paper: #EDEFEC; --panel: #FFFFFF; --sunk: #F5F6F3; --ink: #191C1A; --ink-2: #5E645F; --ink-3: #8A908B;
    --rule: #DCDFDA; --accent: #2B5B78; --accent-ink: #FFFFFF; --ok: #3A6A4B; --warn: #8A6110; --danger: #9E3626;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15181A; --panel: #1D2124; --sunk: #22262A; --ink: #E6E9E6; --ink-2: #A2A9A5; --ink-3: #7C837E;
            --rule: #2E3337; --accent: #8FBBD6; --accent-ink: #11202A; --ok: #8CBE9B; --warn: #D9AC5C; --danger: #E0917F; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.55 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { width: min(640px, 100%); margin: 0 auto; padding: var(--s-6) clamp(var(--s-4), 4vw, var(--s-6)) var(--s-6); }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 var(--s-1); }
  .sub { color: var(--ink-2); margin: 0 0 var(--s-5); }
  .step { display: flex; gap: var(--s-3); padding: var(--s-3) var(--s-4); background: var(--panel);
          border: 1px solid var(--rule); border-radius: 6px; margin-bottom: var(--s-2); }
  .icon { width: 20px; flex: none; text-align: center; font-weight: 700; }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .detail, .msg { color: var(--ink-2); font-size: 12.5px; }
  .msg { margin-top: 4px; }
  .done .icon { color: var(--ok); }
  .failed .icon, .failed .msg { color: var(--danger); }
  .manual .icon { color: var(--warn); }
  .running .icon, .checking .icon { color: var(--accent); }
  pre { margin: var(--s-2) 0 0; max-height: 7.5em; overflow: auto; font-size: 11px; color: var(--ink-2);
        background: var(--sunk); padding: var(--s-1) var(--s-2); border-radius: 4px; white-space: pre-wrap;
        font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  a { color: var(--accent); }
  .bar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; margin: 0 0 var(--s-5); }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .foot { margin-top: var(--s-5); display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; }
  button { font: inherit; font-weight: 500; height: 36px; padding: 0 var(--s-4); border-radius: 6px; border: 0; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  button[hidden] { display: none; }
  .note { color: var(--ink-2); font-size: 12.5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; width: 12px; height: 12px; margin-top: 4px; border: 2px solid var(--rule);
          border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
</style>
</head>
<body>
<main>
  <h1>Setting up Requirements Workbench</h1>
  <p class="sub" id="sub">Installing what the app needs. This happens once and takes a few minutes. You don't need to do anything.</p>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div id="steps"></div>
  <div class="foot">
    <button id="retry" hidden>Retry</button>
    <span class="note" id="note"></span>
  </div>
</main>
<script>
  const ICONS = { pending: "·", checking: "…", running: '<span class="spin"></span>', done: "✓", failed: "✕", manual: "!" };
  const stepsEl = document.getElementById("steps");
  const retryBtn = document.getElementById("retry");
  const note = document.getElementById("note");
  let handedOff = false;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function render(st) {
    const required = st.steps.filter(s => s.required);
    const finished = required.filter(s => s.status === "done").length;
    document.getElementById("bar").style.width = `${Math.round(100 * finished / Math.max(1, required.length))}%`;
    stepsEl.innerHTML = st.steps.map(s => `
      <div class="step ${s.status}">
        <div class="icon">${ICONS[s.status] || "·"}</div>
        <div class="grow">
          <div class="title">${esc(s.title)}${s.required ? "" : " <span class='detail'>(optional)</span>"}</div>
          <div class="detail">${esc(s.detail)}</div>
          ${s.message ? `<div class="msg">${esc(s.message)}</div>` : ""}
          ${s.manual && s.status === "manual" && s.help_urls.length
            ? `<div class="msg">Accept the terms: ${s.help_urls.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">model ${i + 1}</a>`).join(" · ")}. Then add your token in Settings.</div>` : ""}
          ${(s.status === "running" || s.status === "failed") && s.log.length ? `<pre>${esc(s.log.join("\n"))}</pre>` : ""}
        </div>
      </div>`).join("");
    retryBtn.hidden = st.state !== "failed";
    if (st.state === "failed") {
      note.textContent = "Something failed. Check your internet connection and press Retry. Finished steps won't be repeated.";
    } else if (st.state === "done") {
      note.textContent = "Done — starting the app…";
    } else {
      note.textContent = "";
    }
  }

  async function handOff() {
    handedOff = true;
    await fetch("/setup/continue", { method: "POST" });
    // The app replaces this setup screen on the same address; wait until it answers.
    for (let i = 0; i < 240; i++) {
      await new Promise(r => setTimeout(r, 500));
      try {
        const res = await fetch("/health", { cache: "no-store" });
        if (res.ok) { location.href = "/"; return; }
      } catch (_) { /* server restarting */ }
    }
    note.textContent = "The app is taking long to start. Close and reopen it.";
  }

  async function poll() {
    try {
      const st = await (await fetch("/setup/status", { cache: "no-store" })).json();
      render(st);
      if (st.state === "done" && !handedOff) return handOff();
    } catch (_) { /* transient */ }
    if (!handedOff) setTimeout(poll, 1000);
  }

  retryBtn.addEventListener("click", async () => {
    retryBtn.hidden = true;
    await fetch("/setup/retry", { method: "POST" });  // the poll loop picks up the new state
  });

  poll();
</script>
</body>
</html>
